zerops:
  # ==========================================
  # API - Node.js / Express
  # ==========================================
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd backend && npm install
      deployFiles:
        - ./backend/~

    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm start
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health


  # ==========================================
  # ANALYZER - Python / Flask
  # ==========================================
  - setup: analyzer
    build:
      base: alpine/python@3.12
      deployFiles:
        - analyzer/app.py
      addToRunPrepare:
        - analyzer/requirements.txt

    run:
      base: alpine/python@3.12
      prepareCommands:
        - python3 -m pip install -r analyzer/requirements.txt --ignore-installed
      ports:
        - port: 5000
          httpSupport: true
      start: python3 analyzer/app.py

  # ==========================================
  # FRONTEND - React + Vite
  # ==========================================

  - setup: frontend
    build:
      base: alpine/nodejs@22

      buildCommands:
        - cd frontend && npm install
        - cd frontend && npm run build

      deployFiles:
        - frontend/dist
        - frontend/package.json
        - frontend/package-lock.json

    run:
      base: alpine/nodejs@22

      ports:
        - port: 3000
          httpSupport: true

      start: cd frontend && npx serve -s dist -l 3000