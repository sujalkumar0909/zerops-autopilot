zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd backend && npm install
      deployFiles:
        - ./backend/~

    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm start
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health